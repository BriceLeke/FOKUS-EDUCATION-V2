version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fokus_postgres
    environment:
      POSTGRES_USER: fokus_user
      POSTGRES_PASSWORD: fokus_password
      POSTGRES_DB: fokus_education
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fokus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fokus_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fokus_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fokus_user:fokus_password@postgres:5432/fokus_education
      SECRET_KEY: your-secret-key-here-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fokus_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fokus_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/.next
    depends_on:
      - backend
    networks:
      - fokus_network

volumes:
  postgres_data:

networks:
  fokus_network:
    driver: bridge
